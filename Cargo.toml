# Cargo.toml
[package]
name = "meas_app_freq"
version = "0.1.0"
edition = "2021"
description = "Agilent 53131A/132A 周波数カウンタ向け GPIB/VISA リアルタイム計測アプリ"
license = "MIT"

[dependencies]
egui = "0.32.3"
eframe = "0.32.3"
egui_plot = "0.33.0"

visa-rs = { version = "0.6.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
parking_lot = "0.12"

